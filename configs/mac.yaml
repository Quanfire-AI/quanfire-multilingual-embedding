# Compute profile: development laptop.
#
# For writing code, running the tests, and confirming a pipeline is wired
# up correctly on a small corpus. Not for producing a model anyone uses —
# a batch of 16 gives each query only 15 negatives to be contrasted
# against, which is far too easy a task to train a good encoder.
#
# Overlay onto an experiment:
#
#     qfme train --config experiments/indic.yaml --profile configs/mac.yaml

compute:
  # Resolves Apple Metal on Apple Silicon and CPU on Intel. Both work;
  # neither is fast, and that is fine for the job this profile has.
  device: auto

  # fp32 deliberately. Metal's autocast support is incomplete, so asking
  # for bf16 here would be ignored anyway — see `autocast_for`.
  precision: fp32

  batch_size: 16

  # Off. Gradient caching earns its overhead when memory is the binding
  # constraint, and at this batch size it is not.
  gradient_checkpoint_chunk: 0

  # Main process. Worker processes cost more in startup than they return
  # on a corpus this size.
  workers: 0
