# Compute profile: single NVIDIA GPU, 16GB.
#
# Sized for an RTX 4070 Ti SUPER under WSL2. The numbers below are a
# starting point, not a measurement — VRAM use depends on model width,
# depth and sequence length, none of which this file knows. Watch
# `nvidia-smi` on the first real run and adjust.
#
# Overlay onto an experiment:
#
#     qfme train --config experiments/indic.yaml --profile configs/gpu.yaml

compute:
  device: auto

  # Ada Lovelace has native bfloat16. Roughly halves activation memory
  # and needs no loss scaling, unlike fp16.
  precision: bf16

  # The single most valuable change from the laptop profile. Batch size
  # sets how many negatives each query is contrasted against, so this is
  # a quality knob and not only a throughput one.
  batch_size: 256

  # Gradient caching, which is what makes the batch size above reachable
  # on 16GB. Peak memory follows the chunk rather than the batch, and the
  # gradients are identical either way.
  #
  # Raise it if VRAM is spare — fewer, larger chunks run faster.
  gradient_checkpoint_chunk: 32

# Note: no `workers` setting. Training is single-process, so one would do
# nothing. Under WSL2 the thing that actually costs you is the Windows
# filesystem boundary — keep the corpus on the Linux side, under ~,
# rather than /mnt/c.
