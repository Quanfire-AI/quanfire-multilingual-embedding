# gov-indic-e4c — the published v1.1 (`gov-indic-e4-ep6`) re-run on a split
# that does not leak.
#
# `embed-gov-indic` v1.1 is published on "0.184 -> 0.281, +53%, CIs disjoint",
# and that number is in outbound copy. It was measured before the split fix.
# `pib.py` line 193: "Both directions of every language pair are always
# emitted." The old `_select` excluded a training pair only when its *positive*
# was a held-out positive, so the reverse of a held-out pair — same two texts,
# roles swapped, into a symmetric bi-encoder — was never excluded at all.
#
# Reconstructed from the published report's own fields so the comparison is
# against what actually shipped, not against what a config says it should be:
#   train_kinds/eval_kinds  title_body
#   epochs                  6            (v1.0 was 1 epoch and undertrained)
#   trainable_share         0.4988       -> rank 32 on (query, value)
#   sampled_from            11469, eval 1800, trained 7270 after kind filter
#
# Everything else is e3's config unchanged, including seed 0 and the same
# corpus file. Only the split logic differs (66470fe, 6fe7e6b) plus output
# paths, so the published artefacts are not clobbered.
#
# Expect fewer than 7 270 training pairs: the fix drops far more of the pool.
# This is therefore NOT volume-matched to ep6 and the two numbers must not be
# differenced as though split hygiene were the only thing that changed.

# Multilingual government LoRA adapter, third run (embed-gov-indic, e3). Same
# validated e2 recipe (title_body only + language-balanced), on the FULL 4-week
# corpus: 2,065 PIB parallel groups (2,016 multilingual) → 66,352 title_body pairs
# → 11,469 balanced (cap 800/positive-language; 14 langs at 800, kha/ne in full).
# e2's +16.2% was directional-but-not-significant purely on eval SIZE (~615 queries);
# e3 nearly doubles the balanced set to lift the eval and test for significance.
# Everything else matches e2/e1 (multilingual-e5-small, rank 32, lr 1e-4, 1 epoch).
#
#   .venv/bin/qfme adapt --config configs/experiments/gov-indic-e3.yaml --profile configs/gpu.yaml
name: gov-indic-e4c

seed: 0

adaptation:
  checkpoint: intfloat/multilingual-e5-small

  pairs: /home/arnab/quanfire-ai-data/embedding/gov-indic/corpus/pairs-e3.jsonl.gz

  train_pairs: 9669
  eval_pairs: 1800
  sample_pairs: 11469

  adaptation: in-distribution
  train_kinds: title_body
  eval_kinds: title_body
  train_languages: ""
  eval_languages: ""

  epochs: 6
  learning_rate: 0.0001

  rank: 32
  targets: query,value

  pooling: mean
  max_length: 256
  query_prefix: ""
  passage_prefix: ""

  save_adapter: /home/arnab/quanfire-ai-data/embedding/gov-indic/models/gov-indic-e4c
  data_provenance: licensed   # PIB reproduction policy (attribution, no NC/SA)

  report: /home/arnab/quanfire-ai-data/embedding/gov-indic/reports/gov-indic-e4c-adapt.json
