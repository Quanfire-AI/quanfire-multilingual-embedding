name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep uv's cache inside the workspace so actions/cache can pick it up.
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:
  quality:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Lint
        run: uv run ruff check src tests examples

      - name: Check formatting
        run: uv run ruff format --check src tests examples

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Build wheel and sdist
        run: uv build

      # The library is fully typed, so the marker must reach the wheel or
      # downstream consumers silently get no type information at all.
      - name: Verify py.typed is packaged
        run: |
          uv run python - <<'PY'
          import glob
          import zipfile

          wheels = glob.glob("dist/*.whl")

          assert wheels, "no wheel was produced"

          names = zipfile.ZipFile(wheels[0]).namelist()

          assert any(name.endswith("py.typed") for name in names), (
              "py.typed is missing from the wheel"
          )

          print(f"ok: {wheels[0]} contains py.typed")
          PY

      - name: Smoke test the installed package
        run: |
          uv run --isolated --no-project --with dist/*.whl python -c "
          import multilingual_embedding as m
          print('version', m.__version__)
          from multilingual_embedding.corpus import Document
          d = Document.from_text('नमस्ते दुनिया। आज मौसम अच्छा है।', language='hi')
          assert d.sentence_count == 2, d.sentence_count
          print('ok: package imports and segments correctly')
          "

      - uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: dist/

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Build docs
        run: uv run mkdocs build --strict
