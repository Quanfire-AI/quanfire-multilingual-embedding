[project]
name = "quanfire-multilingual-embedding"
version = "0.1.0"
description = "Production-ready multilingual NLP and embedding framework"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "numpy>=1.26,<3.0",
    "pandas>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "sentencepiece>=0.2,<0.3",
    "tqdm>=4.67,<5.0",
]

[project.optional-dependencies]
# Neural training and inference. Kept optional so that the corpus,
# tokenizer, vocabulary and evaluation layers remain a small install for
# callers that only need text preparation — which the LLM and speech work
# will, without wanting a training stack.
#
#     uv sync --extra neural
#
# The version is pinned differently on Intel macOS: torch stopped shipping
# x86_64 macOS wheels after 2.2, so a development machine of that kind caps
# there. Training hosts (Linux and Windows with CUDA) take the current
# release. The split keeps one lockfile resolvable on both.
neural = [
    "torch>=2.2,<2.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch>=2.2; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    # That last Intel macOS build of torch predates NumPy 2 and its interop
    # fails outright — `tensor.numpy()` raises "Numpy is not available" — so
    # NumPy is held below 2 on that platform alone. Verified: the full suite
    # passes on 1.26, so the previous >=2.0 floor was incidental.
    "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.scripts]
qfme = "multilingual_embedding.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multilingual_embedding"]

[dependency-groups]
dev = [
    "build>=1,<2",
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9,<10",
    "mypy>=1.17,<2",
    "pre-commit>=4,<5",
    "pytest>=8,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.12,<1",
    "types-PyYAML>=6,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode lets two test modules share a basename (tests/utils/test_io.py
# and tests/corpus/test_io.py) without needing __init__.py files throughout the
# test tree.
addopts = "--import-mode=importlib --strict-markers"
markers = [
    "slow: tests that train a model and take more than a second",
]

[tool.coverage.run]
source = ["src/multilingual_embedding"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    # The framework deliberately shadows `format` and `filter` on config
    # and corpus objects, where those are the domain-correct names.
    "A003",
    # Ambiguous-unicode checks. This is a multilingual NLP framework:
    # fullwidth Latin, Arabic presentation forms and Greek sigma are the
    # subject matter, not typos, and they are exactly what the
    # normalizers exist to fold. Every occurrence would be a false
    # positive.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests may use assert and shadow fixtures freely.
"tests/**" = ["S101"]
# `from torch.nn import functional as F` is the universal convention in
# PyTorch code. Renaming it to satisfy the naming rule would make this
# package read unlike every other model implementation.
"src/multilingual_embedding/embedding/neural/*" = ["N812"]
"tests/embedding/test_neural.py" = ["N812"]
"tests/embedding/test_lora_gradcache.py" = ["N812"]

[tool.mypy]
python_version = "3.12"
files = ["src/multilingual_embedding"]
strict = true
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
# SentencePiece ships no type stubs.
module = ["sentencepiece.*"]
ignore_missing_imports = true
