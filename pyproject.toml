[project]
name = "quanfire-multilingual-embedding"
version = "0.1.0"
description = "Production-ready multilingual NLP and embedding framework"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "numpy>=2.0,<3.0",
    "pandas>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "sentencepiece>=0.2,<0.3",
    "tqdm>=4.67,<5.0",
]

[project.scripts]
qfme = "multilingual_embedding.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multilingual_embedding"]

[dependency-groups]
dev = [
    "build>=1,<2",
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9,<10",
    "mypy>=1.17,<2",
    "pre-commit>=4,<5",
    "pytest>=8,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.12,<1",
    "types-PyYAML>=6,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode lets two test modules share a basename (tests/utils/test_io.py
# and tests/corpus/test_io.py) without needing __init__.py files throughout the
# test tree.
addopts = "--import-mode=importlib --strict-markers"
markers = [
    "slow: tests that train a model and take more than a second",
]

[tool.coverage.run]
source = ["src/multilingual_embedding"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    # The framework deliberately shadows `format` and `filter` on config
    # and corpus objects, where those are the domain-correct names.
    "A003",
    # Ambiguous-unicode checks. This is a multilingual NLP framework:
    # fullwidth Latin, Arabic presentation forms and Greek sigma are the
    # subject matter, not typos, and they are exactly what the
    # normalizers exist to fold. Every occurrence would be a false
    # positive.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests may use assert and shadow fixtures freely.
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
files = ["src/multilingual_embedding"]
strict = true
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
# SentencePiece ships no type stubs.
module = ["sentencepiece.*"]
ignore_missing_imports = true
